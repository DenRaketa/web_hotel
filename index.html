<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test</title>

</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="header_container _container">
                <div class="header_container__left">

                    <a class="header_logo" href="">Your<span>.logo</span></a>

                    <nav class="header__menu menu">
                        <ul class="menu__list">
                            <li class="menu__item">
                                <a href="" class="menu__link">Last Minute Deals</a>
                            </li>
                            <li class="menu__item">
                                <a href="" class="menu__link">Blog</a>
                            </li>
                            <li class="menu__item">
                                <a href="" class="menu__link">About us</a>
                            </li>
                            <li class="menu__item">
                                <a href="" class="menu__link">Contacts</a>
                            </li>
                        </ul>
                    </nav>
                </div>
                <div class="end">
                    <div class="user_menu">
                        <div class="user_menu_block">
                            <a href="/" class="dollar">$</a>
                        </div>
                        <div class="user_menu_block">
                            <a href="/" class="language">EN</a>
                        </div>
                        <div class="user_menu_block">
                            <img src=".//img/icons/profile.svg" alt="my profile" class="my_profile">
                        </div>
                    </div>
                </div>

            </div>

        </header>

        <section class="hero _container">
            <div class="hero__content">
                <h1>Find an apartment for your vacation</h1>
                <p>We have several thousand apartments for every taste in every corner of the globe</p>
            </div>
        </section>

        <div class="hero_search_block">
            <div class="location">
                <img src=".//img/icons/location.svg" alt="icon_location">
                <div>
                    <h3>Where</h3>
                    <p>Search Destination</p>
                </div>
            </div>
            <div class="calendar">
                <img src=".//img/icons/calendar.svg" alt="icon_calendar">
                <div>
                    <h4>When</h4>
                    <p>Select Date</p>
                </div>
            </div>
            <button class="search">
                <div class="search__circle">
                    <img src=".//img/icons/search.svg" alt="icon_search">
                </div>
            </button>

        </div>





    </div>
    </main>
    </div>



</body>

</html>
